services:
  prestart:
    image: moonbase/server:prod
    build:
      target: prod
    environment:
      NODE_ENV: production
  app:
    image: moonbase/server:prod
    build:
      target: prod
    environment:
      NODE_ENV: production
    env_file:
      - .env.prod
    ports:
      - 4000:4000
    command: pnpm run start:prod
